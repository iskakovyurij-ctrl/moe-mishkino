<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Вход — Моё Мишкино</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .login-container {
            max-width: 400px;
            margin: 5rem auto;
            padding: 2rem;
            border: 1px solid #ddd;
            border-radius: 8px;
            background: #f9f9f9;
        }
        .login-container h2 {
            text-align: center;
            margin-bottom: 1.5rem;
        }
        .login-field {
            margin-bottom: 1rem;
        }
        .login-field label {
            display: block;
            margin-bottom: 0.5rem;
        }
        .login-field input {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }
        .btn-submit {
            width: 40px;
            padding: 0.75rem;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 1rem;
        }
        .btn-submit:hover {
            background-color: #0056b3;
        }
        .error-msg {
            color: #d9534f;
            margin-top: 1rem;
            text-align: center;
            display: none;
        }
        .auth-links {
            text-align: center;
            margin-top: 1.5rem;
            font-size: 0.9rem;
        }
        .auth-links a {
            color: #007bff;
            text-decoration: none;
        }
        .auth-links a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <header class="site-header">
        <div class="logo-menu">
            <h1><a href="index.html">Моё Мишкино</a></h1>
        </div>
    </header>

    <main class="content">
        <div class="login-container">
            <h2>Вход в личный кабинет</h2>
            <form id="loginForm">
                <div class="login-field">
                    <label for="login">Логин</label>
                    <input type="text" id="login" name="login" required autofocus>
                </div>
                <div class="login-field">
                    <label for="password">Пароль</label>
                    <input type="password" id="password" name="password" required>
                </div>
                <button type="submit" class="btn-submit">Войти</button>
                <div class="error-msg" id="errorMsg">Неверный логин или пароль</div>
            </form>
            
            <div class="auth-links">
                <a href="registration.html">Зарегистрироваться</a> | <a href="index.html">На главную</a>
            </div>
        </div>
    </main>

    <footer class="site-footer">
        <p>&copy; 2026 "Моё Мишкино".</p>
    </footer>

    <!-- ПОДКЛЮЧЕНИЕ СКРИПТОВ -->
    <script src="js/auth.js"></script>

    <!-- ИНИЦИАЛИЗАЦИЯ СТРАНИЦЫ -->
    <script>
    document.addEventListener('DOMContentLoaded', () => {
        // Гарантируем, что функция обработки формы будет вызвана
        if (typeof setupLoginForm === 'function') {
            setupLoginForm();
        }

        // Также обновим кнопки в шапке (например, скроем "Войти", если вдруг пришли сюда авторизованными)
        if (typeof updateAuthLinks === 'function') {
            updateAuthLinks();
        }
    });
    </script>
</body>
</html>
